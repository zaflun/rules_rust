name: Release Cargo-bazel
on:
  workflow_dispatch:
  push:
    branches:
      - zaflun-fork

defaults:
  run:
    shell: bash

jobs:
  builds:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: x86_64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      NAME: "cargo-bazel-${{ matrix.os }}-${{ matrix.arch }}"
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchains for host
        run: |
          version="$(grep 'DEFAULT_RUST_VERSION =' ./rust/private/common.bzl | grep -o '[[:digit:].]\+')"
          rustup install "${version}"
          rustup override set "${version}"

      - name: Build cargo-bazel
        run: cargo build -r -p cargo-bazel
        working-directory: ./crate_universe

      - name: Generate archive with BUILD
        env:
          ARTIFACT_NAME: ${{ env.NAME }}
        run: |
          mkdir -p artifacts-archive
          BIN_NAME="cargo-bazel"

          mkdir -p "$ARTIFACT_NAME"
          cp "./crate_universe/target/release/$BIN_NAME" "$ARTIFACT_NAME/"

          cat > "$ARTIFACT_NAME/BUILD" <<EOF
          exports_files(["${BIN_NAME}"])

          load("@rules_shell//shell:sh_binary.bzl", "sh_binary")

          sh_binary(
              name = "bin",
              srcs = ["${BIN_NAME}"],
              visibility = ["//visibility:public"],
          )

          EOF

          tar -cf - "$ARTIFACT_NAME" | zstd --ultra -22 -o "artifacts-archive/$ARTIFACT_NAME.tar.zst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: artifacts-archive/${{ env.NAME }}.tar.zst

  release:
    needs: builds
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      COMMIT_SHA: ${{ github.sha }}
      REPO_NAME: ${{ github.repository }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate release body
        run: |
          set -euo pipefail
          shopt -s globstar

          TAG_NAME="commit-${COMMIT_SHA}"

          echo '```bazel' > release_body.txt
          cat >> release_body.txt <<EOF
          bazel_dep(name = "rules_rust")

          git_override(
              module_name = "rules_rust",
              commit = "${COMMIT_SHA}",
              remote = "https://github.com/${REPO_NAME}.git",
          )

          http_archive = use_repo_rule("@bazel_tools//tools/build_defs/repo:http.bzl", "http_archive")

          cargo_bazel_url = "https://github.com/${REPO_NAME}/releases/download/${TAG_NAME}/"
          EOF

          echo '' >> release_body.txt

          for archive in ./artifacts/**/*.tar.zst; do
            FILE_NAME=$(basename "$archive")
            SHA=$(sha256sum "$archive" | awk '{print $1}')
            NAME="${FILE_NAME%.tar.zst}"

            cat >> release_body.txt <<EOF
          http_archive(
              name = "$NAME",
              sha256 = "$SHA",
              strip_prefix = "$NAME",
              url = cargo_bazel_url + "$FILE_NAME",
          )
          EOF

            echo '' >> release_body.txt
          done

          echo '```' >> release_body.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: "commit-${{ github.sha }}"
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "cargo-bazel build for ${{ env.COMMIT_SHA }}"
          body_path: release_body.txt
          files: ./artifacts/**/*.tar.zst
